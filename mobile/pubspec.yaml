name: ai_live_translator
description: Two-person speech translation with a Supabase control plane.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  supabase_flutter: ^2.18.3
  http: ^1.5.0
  web_socket_channel: ^3.0.3
  record: ^6.1.2
  audioplayers: ^6.5.1
  audio_session: ^0.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  permission_handler: ^12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
