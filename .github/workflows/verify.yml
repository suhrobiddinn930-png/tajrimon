name: Verify foundation
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['54329:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - name: Prepare disposable PostgreSQL with minimal Auth shim
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          from scripts.test_postgres import SHIM
          with psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True) as db:
              db.execute(SHIM)
              for path in sorted(Path('supabase/migrations').glob('*.sql')):
                  db.execute(path.read_text())
          PY
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest -q
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
