project_id = "ai-live-translator"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 15
[auth]
enabled = true
site_url = "http://127.0.0.1:8001/app/"
additional_redirect_urls = [
  "http://127.0.0.1:8001/app/",
  "http://localhost:8001/app/",
  "ai.live.translator://auth-callback/",
]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
[realtime]
enabled = true
